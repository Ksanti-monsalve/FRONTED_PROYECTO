<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos — AutoTallerManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .modal-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:#0d0e11; border:1px solid var(--gold-border); border-radius:6px; padding:32px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; }
        .modal-box h3 { font-family:var(--font-serif); font-size:1.1rem; font-weight:400; color:var(--champagne-gold); margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid var(--gold-border); }
        .modal-close { float:right; background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; line-height:1; margin-top:-4px; }
        .modal-close:hover { color:var(--text-ivory); }
        .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    </style>
</head>
<body class="dashboard-page module-page">
    <div class="luxury-bg-mesh"></div>

    <header class="app-layout-header">
        <div class="layout-brand">
            <span class="brand-tagline">AutoTallerManager</span>
            <h1>Repuestos e inventario</h1>
        </div>
        <nav class="layout-nav" id="layout-nav"></nav>
        <div class="layout-user">
            <div>
                <p class="layout-user-name" id="layout-user-name">—</p>
                <p class="layout-user-role" id="layout-user-role">—</p>
            </div>
            <button type="button" class="btn-dashboard" id="btn-logout">Salir</button>
        </div>
    </header>

    <p class="api-status" id="layout-api-status"></p>
    <div class="page-alert" id="page-message" hidden></div>

    <main class="dashboard-shell">
        <section class="dashboard-card">
            <div class="section-toolbar">
                <h2>Stock crítico</h2>
                <div style="display:flex;gap:8px;">
                    <button type="button" class="btn-dashboard" id="btn-reload">Actualizar</button>
                    <button type="button" class="btn-dashboard btn-dashboard-primary" id="btn-nuevo-repuesto" style="display:none">+ Nuevo Repuesto</button>
                </div>
            </div>
            <div id="critical-container" class="table-wrap">
                <p class="table-loading">Consultando /api/Repuestos/stock-critico...</p>
            </div>
        </section>

        <section class="dashboard-card">
            <h2>Inventario completo</h2>
            <div id="table-container" class="table-wrap">
                <p class="table-loading">Cargando repuestos...</p>
            </div>
        </section>
    </main>

    <!-- ═══════════════ MODAL NUEVO REPUESTO ═══════════════ -->
    <div class="modal-overlay" id="modal-nuevo-repuesto">
        <div class="modal-box">
            <h3>Nuevo Repuesto / Insumo <button class="modal-close" id="rep-close">✕</button></h3>
            <div class="form-row">
                <div class="form-field">
                    <label for="rep-codigo">Código *</label>
                    <input type="text" id="rep-codigo" placeholder="REP-001" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
                <div class="form-field">
                    <label for="rep-unidad">Unidad</label>
                    <input type="text" id="rep-unidad" placeholder="Unidad, Litro, Kit..." style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
            </div>
            <div class="form-field" style="margin-top:10px;">
                <label for="rep-nombre">Nombre *</label>
                <input type="text" id="rep-nombre" placeholder="Nombre del repuesto o insumo" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
            </div>
            <div class="form-field" style="margin-top:10px;">
                <label for="rep-descripcion">Descripción</label>
                <textarea id="rep-descripcion" rows="2" placeholder="Descripción adicional (opcional)" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;resize:vertical;"></textarea>
            </div>
            <div class="form-field" style="margin-top:10px;">
                <label for="rep-categoria">Categoría *</label>
                <select id="rep-categoria" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                    <option value="">Cargando categorías...</option>
                </select>
            </div>
            <div class="form-field" style="margin-top:10px;">
                <label for="rep-tipo-servicio">Tipo de servicio relacionado</label>
                <select id="rep-tipo-servicio" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                    <option value="">General (aplica a todos los servicios)</option>
                </select>
                <small style="color:var(--text-muted);font-size:11px;margin-top:4px;display:block">Al asignarlo, este repuesto aparecerá primero cuando se seleccione ese tipo de servicio en un presupuesto.</small>
            </div>
            <div class="form-row" style="margin-top:10px;">
                <div class="form-field">
                    <label for="rep-precio-compra">Precio Compra *</label>
                    <input type="number" id="rep-precio-compra" min="0" step="0.01" placeholder="0.00" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
                <div class="form-field">
                    <label for="rep-precio-venta">Precio Venta *</label>
                    <input type="number" id="rep-precio-venta" min="0" step="0.01" placeholder="0.00" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
            </div>
            <div class="form-row" style="margin-top:10px;">
                <div class="form-field">
                    <label for="rep-stock-actual">Stock Actual *</label>
                    <input type="number" id="rep-stock-actual" min="0" value="0" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
                <div class="form-field">
                    <label for="rep-stock-minimo">Stock Mínimo *</label>
                    <input type="number" id="rep-stock-minimo" min="0" value="1" style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-dashboard" id="rep-cancel">Cancelar</button>
                <button type="button" class="btn-dashboard btn-dashboard-primary" id="rep-guardar">Guardar Repuesto</button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../utils.js"></script>
    <script src="../api.js"></script>
    <script src="../auth-guard.js"></script>
    <script src="../layout.js"></script>
    <script src="repuestos.js"></script>
</body>
</html>
