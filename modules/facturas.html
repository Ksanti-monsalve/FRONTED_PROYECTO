<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas — AutoTallerManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
        .modal-overlay.open{display:flex;}
        .modal-box{background:#0d0e11;border:1px solid var(--gold-border);border-radius:6px;padding:32px;width:100%;max-width:460px;}
        .modal-box h3{font-family:var(--font-serif);font-size:1.1rem;font-weight:400;color:var(--champagne-gold);margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--gold-border);}
        .modal-close{float:right;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;}
        .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
        .badge-finalizada{background:rgba(34,197,94,.18);color:#4ade80;}
        .badge-pendiente{background:rgba(234,179,8,.18);color:#fbbf24;}
        .btn-accion{font-size:11px;padding:3px 10px;border-radius:3px;border:1px solid;cursor:pointer;background:transparent;white-space:nowrap;}
    </style>
</head>
<body class="dashboard-page module-page">
    <div class="luxury-bg-mesh"></div>

    <header class="app-layout-header">
        <div class="layout-brand">
            <span class="brand-tagline">AutoTallerManager</span>
            <h1>Facturas</h1>
        </div>
        <nav class="layout-nav" id="layout-nav"></nav>
        <div class="layout-user">
            <div>
                <p class="layout-user-name" id="layout-user-name">—</p>
                <p class="layout-user-role" id="layout-user-role">—</p>
            </div>
            <button type="button" class="btn-dashboard" id="btn-logout">Salir</button>
        </div>
    </header>

    <p class="api-status" id="layout-api-status"></p>
    <div class="page-alert" id="page-message" hidden></div>

    <main class="dashboard-shell">
        <!-- Pagos pendientes de confirmar (efectivo) / tokens electrónicos -->
        <section class="dashboard-card" id="solicitudes-section" style="display:none">
            <div class="section-toolbar">
                <h2>Solicitudes de Pago Pendientes</h2>
                <span id="solicitudes-count" class="badge badge-pendiente" style="font-size:11px">0</span>
            </div>
            <div id="solicitudes-container" class="table-wrap">
                <p class="table-loading">Cargando...</p>
            </div>
        </section>

        <section class="dashboard-card">
            <div class="section-toolbar">
                <h2>Facturas Registradas</h2>
                <button type="button" class="btn-dashboard" id="btn-reload">Actualizar</button>
            </div>
            <div id="table-container" class="table-wrap">
                <p class="table-loading">Cargando facturas...</p>
            </div>
            <div class="pagination-bar" id="pagination-bar"></div>
        </section>
    </main>

    <!-- ═══════════════════ MODAL REGISTRAR PAGO ═══════════════════ -->
    <div class="modal-overlay" id="modal-pago">
        <div class="modal-box">
            <h3>Registrar Pago <button class="modal-close" id="pago-close">✕</button></h3>

            <div class="form-field" style="margin-bottom:12px;">
                <label for="pago-metodo">Método de pago *</label>
                <select id="pago-metodo"
                    style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;margin-top:4px;">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="form-field" style="margin-bottom:12px;">
                <label for="pago-monto">Monto recibido *</label>
                <input type="number" id="pago-monto" min="0" step="1000"
                    style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;margin-top:4px;">
            </div>

            <div class="form-field" style="margin-bottom:12px;">
                <label for="pago-referencia">Referencia / N° transacción (opcional)</label>
                <input type="text" id="pago-referencia" placeholder="Ej: TRX-123456"
                    style="width:100%;background:#1a1b1f;border:1px solid var(--gold-border);color:#e8e4dc;padding:8px 12px;border-radius:4px;font-family:inherit;font-size:13px;margin-top:4px;">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-dashboard" id="pago-cancel">Cancelar</button>
                <button type="button" class="btn-dashboard btn-dashboard-primary" id="btn-confirmar-pago">
                    Confirmar Pago
                </button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../utils.js"></script>
    <script src="../api.js"></script>
    <script src="../auth-guard.js"></script>
    <script src="../layout.js"></script>
    <script src="facturas.js"></script>
</body>
</html>
